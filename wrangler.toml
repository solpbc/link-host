name = "link-host"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# go.solstone.app serves the solstone surface; link.solpbc.org serves the
# extro surface. Single environment (no staging/prod split), matching the
# spl-relay precedent. Self-hosters who fork should replace the routes below
# with their own hostnames and `wrangler deploy` under their own CF account.
[[routes]]
pattern = "link.solpbc.org"
custom_domain = true

[[routes]]
pattern = "go.solstone.app"
custom_domain = true

# Observability tail covers operational debugging. Worker logs at this tail
# level intentionally surface only `<method> <path> <status>` per the
# served route — no payload, no headers, no UA. The page's URL fragment is
# never seen because RFC 3986 fragments are processed client-side.
[observability]
enabled = true
