name = "link-host"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# go.solstone.app serves the solstone surface; link.solpbc.org serves the
# extro surface. Single environment (no staging/prod split), matching the
# spl-relay precedent. Self-hosters who fork should replace the routes below
# with their own hostnames and `wrangler deploy` under their own CF account.
[[routes]]
pattern = "link.solpbc.org"
custom_domain = true

[[routes]]
pattern = "go.solstone.app"
custom_domain = true

# Workers Logs is off, so it stores nothing for this Worker. Each setting is
# explicit so a deploy keeps it off. This doesn't reach what Cloudflare's network
# records when it handles a request. The fragment guarantee is separate: RFC 3986
# fragments are processed client-side and never enter HTTP.
[observability]
enabled = false

[observability.logs]
enabled = false
persist = false
invocation_logs = false
